name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Check code
        run: cargo clippy --all-targets --locked

      - name: Build release executables
        run: cargo build --release --locked

      - name: Package executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/codenotch.exe dist/Codenotch.exe
          Copy-Item target/release/codenotch-hook.exe dist/Codenotch-Hook.exe
          Compress-Archive -Path dist/Codenotch.exe,dist/Codenotch-Hook.exe -DestinationPath dist/Codenotch-Windows-x64.zip
          $hash = (Get-FileHash dist/Codenotch-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Codenotch-Windows-x64.zip" | Set-Content -Encoding ascii dist/Codenotch-Windows-x64.zip.sha256

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Codenotch-Windows-x64
          path: |
            dist/Codenotch.exe
            dist/Codenotch-Hook.exe
            dist/Codenotch-Windows-x64.zip
            dist/Codenotch-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/Codenotch.exe `
            dist/Codenotch-Hook.exe `
            dist/Codenotch-Windows-x64.zip `
            dist/Codenotch-Windows-x64.zip.sha256 `
            --title "Codenotch for Windows ${{ github.ref_name }}" `
            --generate-notes
