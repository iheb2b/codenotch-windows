[package]
name = "codenotch"
version = "0.4.3"
edition = "2021"
rust-version = "1.94"
description = "Codenotch for Windows — usage and approval notch for Claude, Codex, Cursor, Copilot and Antigravity"
license = "MIT"
repository = "https://github.com/iheb2b/codenotch-windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dirs = "5"
notify = "6"
ureq = { version = "2", features = ["json", "native-tls"] } # native-tls: the Antigravity local bridge's self-signed certificate is accepted for 127.0.0.1 only
native-tls = "0.2"
png = "0.17" # application icon → PNG (provider marks taken from the installed app's resources)
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Cursor's credential lives in state.vscdb (SQLite); bundled = compile the SQLite C sources with the crate, which adds 1–2 minutes to the first build
rusqlite = { version = "0.32", features = ["bundled"] }
# Official GitHub Copilot SDK. The CLI is deliberately not bundled: Codenotch reads quota only
# when the user already has Copilot CLI installed and signed in.
github-copilot-sdk = { version = "=1.0.13", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Credentials",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_Globalization",
  "Win32_System_Console",
] }
